<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>正在打开…</title>
<meta name="robots" content="noindex">
<style>
:root{--tb:#ff5000;--ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f6f7f9;color:#1a1f2b;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:420px;margin:0 auto;padding:60px 22px 40px}
.card{background:#fff;border-radius:16px;padding:28px 20px;text-align:center;
  box-shadow:0 10px 30px rgba(18,25,40,.07)}
.sp{width:34px;height:34px;margin:2px auto 14px;border-radius:50%;
  border:3px solid #ffe4d4;border-top-color:var(--tb);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:17px;margin:0 0 6px;font-weight:800}
p.sub{margin:0;color:#6b7280;font-size:13px}
.id{margin-top:10px;font-size:12px;color:#9aa3b2}
.btn{display:block;height:46px;line-height:46px;border-radius:999px;font-weight:700;font-size:15px;
  text-decoration:none;margin-top:12px;border:0;width:100%;cursor:pointer;font-family:inherit}
.main{background:var(--tb);color:var(--ink);box-shadow:0 6px 16px rgba(255,80,0,.28)}
.ghost{background:#f1f4f9;color:#4b5563}
.tip{margin-top:14px;font-size:12px;color:#9aa3b2;line-height:1.75;text-align:left;
  background:#fafbfd;border:1px dashed #e6eaf2;border-radius:10px;padding:9px 11px}
.tip b{color:var(--tb)}
#fb{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="sp" id="sp"></div>
    <h1 id="h1">正在打开…</h1>
    <p class="sub" id="sub">商品：<span id="pid">-</span></p>
    <div id="fb">
      <button class="btn main" id="go">打开商品页</button>
      <button class="btn ghost" id="cp">复制链接</button>
      <div class="tip" id="tip">微信里没自动打开时：点右上角 <b>⋯</b> → <b>在浏览器打开</b>；或复制链接后打开 App，会自动弹出这个商品。</div>
      <a class="btn ghost" href="./">← 回到价目表</a>
    </div>
  </div>
</div>
<script>
/* GameTable 中转页 (2026-10-20 / 改134 建, 改138 重写)
   ⚠️ 关键: 微信里**绝不能自动导航到淘宝/闲鱼域名** —— 会被微信拦到「请长按复制后使用浏览器访问」的
      拦截页。所以微信内只做三件事: 唤起 App -> 一键复制 -> 引导; 普通浏览器里才自动跳官方 H5 商品页。
   链接只带商品 id —— id 永不过期, 不必再用 App 分享的短链(短链带 tk 令牌会到期)。 */
(function(){
  var q=location.search||"";
  var id=(q.match(/[?&]id=(\d+)/)||[])[1]||"";
  var isXY=/[?&]s=xy\b/i.test(q);
  var WX=/MicroMessenger/i.test(navigator.userAgent);
  var APP=isXY?"闲鱼":"淘宝";
  var H5=isXY?("https://h5.m.goofish.com/item?id="+id):("https://h5.m.taobao.com/awp/core/detail.htm?id="+id);
  var SCHEMES=isXY?["fleamarket://item?id="+id,"goofish://item?id="+id]
                  :["tbopen://item.taobao.com/item.htm?id="+id,"taobao://item.taobao.com/item.htm?id="+id];
  if(isXY){document.documentElement.style.setProperty("--tb","#ffda00");
           document.documentElement.style.setProperty("--ink","#3d2f00");
           document.querySelector(".sp").style.borderColor="#fff3b0";}
  document.title="正在打开"+APP+"…";
  var pid=document.getElementById("pid");
  if(id)pid.textContent=id;
  if(!id){
    document.getElementById("sp").style.display="none";
    document.getElementById("h1").textContent="缺少商品信息";
    document.getElementById("fb").style.display="block";
    document.getElementById("go").style.display="none";
    document.getElementById("cp").style.display="none";
    return;
  }
  var left=false,t0=Date.now(),shown=false;
  document.addEventListener("visibilitychange",function(){if(document.hidden)left=true;});
  window.addEventListener("pagehide",function(){left=true;});
  function iframe(s){
    try{var f=document.createElement("iframe");
      f.style.cssText="display:none;width:0;height:0;border:0";
      f.src=s;document.body.appendChild(f);
      setTimeout(function(){try{document.body.removeChild(f);}catch(e){}},700);}catch(e){}
  }
  function wake(){
    iframe(SCHEMES[0]);
    setTimeout(function(){if(!left)iframe(SCHEMES[1]);},320);
  }
  function copy(){
    try{
      var t=document.createElement("textarea");
      t.value=H5;t.setAttribute("readonly","");
      t.style.cssText="position:fixed;left:-9999px;top:0";
      document.body.appendChild(t);t.select();
      if(t.setSelectionRange)t.setSelectionRange(0,H5.length);
      try{document.execCommand("copy");}catch(e){}
      try{document.body.removeChild(t);}catch(e){}
    }catch(e){}
    try{if(navigator.clipboard)navigator.clipboard.writeText(H5);}catch(e){}
  }
  function fallback(){
    if(shown)return;shown=true;
    document.getElementById("sp").style.display="none";
    document.getElementById("h1").textContent=WX?("没能自动打开"+APP):("正在打开"+APP+"…");
    var go=document.getElementById("go");
    go.textContent=WX?("打开"+APP+"App"):("打开"+APP+"商品页");
    document.getElementById("tip").innerHTML=
      '微信里不能直接打开'+APP+'链接。<b>链接已复制</b>：打开'+APP+'会自动弹出这个商品（iOS 首次点「允许粘贴」）。<br>'+
      '也可以点右上角 <b>⋯</b> → <b>在浏览器打开</b>。';
    document.getElementById("fb").style.display="block";
  }
  /* 普通浏览器(Chrome/Safari 等): 直接进官方 H5 商品页, 不会被拦 */
  if(!WX){
    copy();
    wake();
    setTimeout(function(){if(!left)location.replace(H5);},650);
  }else{
    /* 微信: 只唤起 App, 绝不自动跳淘宝域(会撞「长按复制」拦截页) */
    copy();
    wake();
    setInterval(function(){
      if(!shown&&!left&&Date.now()-t0>1500)fallback();
    },600);
  }
  document.getElementById("go").onclick=function(){
    if(WX){wake();this.textContent="正在打开…";var b=this;setTimeout(function(){b.textContent="打开"+APP+"App";},1600);}
    else{location.href=H5;}
  };
  document.getElementById("cp").onclick=function(){
    copy();
    this.textContent="已复制 ✓";
    var b=this;setTimeout(function(){b.textContent="复制链接";},1500);
  };
})();
</script>
</body>
</html>

name: auto-covers

# 方案A封面维护: 匹配缺失封面的游戏并入库
# - 每周日 20:00 北京时间自动运行
# - 可在 Actions 页面手动触发 (Run workflow)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0"

permissions:
  contents: write

concurrency:
  group: auto-covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 匹配并下载缺失封面
        run: |
          python match_covers.py || true
          python fallback_search.py || true
          python download_covers.py || true

      - name: 提交新封面
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers match_out || true
          git diff --cached --quiet && echo "无新增封面" || git commit -m "covers: auto update"
          # 带 rebase 重试的推送（同步机器人每15分钟会抢跑）
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then
              if git push; then ok=1; echo "push OK (attempt $i)"; break; fi
            else
              git rebase --abort || true
            fi
            echo "push retry $i failed"; sleep 12
          done
          [ $ok -eq 1 ] || (echo "::warning::push failed after 5 retries, 下次运行会重试" && exit 1)

name: sync-and-deploy

on:
  schedule:
    - cron: '0 * * * *'   # 每小时整点(UTC, 与北京时间整点一致) - 安全兜底重建
  workflow_dispatch: {}    # 支持手动触发
  push:
    branches: [main]
    paths:                # 命中任一即立即构建发布
      - 'data/**'         # AirScript 云端脚本推新数据
      - 'covers/**'       # 手工/脚本换封面(manifest+图片)
                          # 注: 构建内 autocover 的 bot commit 用 GITHUB_TOKEN 推送, 不会再触发本 workflow

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 留边版封面(无竖图时把方图补虚化边到 3:4)依赖 Pillow
      - name: Install Pillow for cover padding
        run: pip install --quiet pillow || true

      # ★ 多库存封面沿用(2026-09-18 店主定稿): 同一商品只是加库存(漫威金刚狼1/2/3…、鬼武者：剑之道1…)
      #   新行直接沿用同款已确认封面, 只增不删 —— 绝不留空, 也绝不动已有封面
      - name: Inherit covers for extra stock rows
        run: |
          python3 parse_ps.py data/ps_grid.json data/ps_games.json || true
          python3 inherit_stock_covers.py || true

      # 自动封面: 发现新增商品 -> 港服 zh-Hans 搜索官方主图 -> 严格唯一匹配才入库
      - name: Auto-fetch covers for new products
        run: python3 autocover.py

      # 有新封面则提交回仓库(只动 covers/**, 不会再触发本 workflow)
      - name: Commit auto-fetched covers
        run: |
          git config user.name "autocover-bot"
          git config user.email "autocover-bot@users.noreply.github.com"
          git add covers
          if git diff --cached --quiet; then
            echo "no new covers"
          else
            git commit -m "covers(auto): 新商品封面自动抓取"
            git pull --rebase origin main || true
            git push || (sleep 8 && git pull --rebase origin main || true && git push || echo "push failed, next run will retry")
          fi

      - name: Build site from latest data
        run: python3 sync_all.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="description" content="「夏天Jackey」PS丨NS 数字版游戏租赁价目表（顾客展示页）">
<link rel="icon" type="image/jpeg" href="avatar.jpg">
    <title>「夏天Jackey」PS丨NS 数字版游戏</title>
<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#181d27; --sub:#6b7280; --line:#e7eaf0;
  --brand:#2444c8; --brand2:#7c3aed; --gold:#b7791f; --goldbg:#fff7e0;
  --ok:#16a34a; --okbg:#e9f9ef; --no:#9ca3af; --nobg:#f1f3f6;
  --ps:#1d6fe0; --ns:#e4002b; --psbg:#eaf2ff; --nsbg:#ffeef1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select{font:inherit}

/* 改40: 返回顶部悬浮按钮 */
/* 改49: 返回顶部按钮带文字, 点击立即回顶 */
.toTop{position:fixed;right:16px;bottom:28px;height:44px;padding:0 16px;border-radius:999px;background:var(--card);color:var(--brand);border:1px solid var(--line);box-shadow:0 2px 10px rgba(16,24,40,.18);font-size:13px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s,transform .25s;z-index:60}
.toTop.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.toTop:active{transform:scale(.94)}

/* ---------- 顶部 ---------- */
.hero{position:relative;background:#0d1440;color:#fff;padding:22px 16px 66px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url('bg.jpg') center/cover no-repeat;opacity:.5}
.hero-inner{position:relative;z-index:1;max-width:1060px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:46px;height:46px;border-radius:14px;overflow:hidden;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand h1{font-size:20px;letter-spacing:.5px}
.brand .sub{color:#c7d2fe;font-size:12px;margin-top:2px}
/* 改44: 活动横幅两行对齐排版 —— 左侧标签 + 丨 + 活动文案 */
.promo{margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px);display:inline-flex;gap:10px;align-items:center;border-radius:14px;padding:10px 16px;font-size:12.5px;color:#ffe9b0}
/* 改51: 活动横幅 —— 可认证/非认证合并为表头, 两档活动独立成行, 表达两类租赁都适用 */
.promo .plines{display:flex;flex-direction:column;gap:6px;line-height:1.5}
.promo b{color:#ffd76a}
.promo .plines i{display:block;font-style:normal}

/* 平台选择 */
.tabs{max-width:1060px;margin:-46px auto 0;padding:0 16px;position:relative;z-index:2}
/* 改48: 两个标签严格等宽等高对称 */
/* 改53: 三个标签统一为可见药丸样式, 未选中浅灰底, 选中各自品牌色, 视觉完全一致 */
.tabbar{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
/* 改57: 未选中标签底色加深+描边, 三个药丸清晰一致 */
.tab{flex:1 1 0;min-width:0;height:46px;padding:0 6px;border-radius:11px;background:#e9edf4;border:1px solid #dde3ec;color:#4b5563;font-weight:600;text-align:center;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box}
.tab.on{border-color:transparent}
.tab .cnt{font-size:11px;background:#eef1f6;border-radius:999px;padding:1px 7px;font-weight:700;color:#6b7280}
/* 改63: 标签文字禁止换行 */
.tab span{white-space:nowrap}
@media (max-width:430px){
  .tab{font-size:13px;gap:4px;padding:0 3px}
  .tab .cnt{padding:1px 5px;font-size:10px}
}
.tab.on{background:linear-gradient(135deg,#2444c8,#6d28d9);color:#fff}
.tab.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.tab.ps.on{background:linear-gradient(135deg,#1d6fe0,#123a8c)}
.tab.ns.on{background:linear-gradient(135deg,#e4002b,#8f001b)}
/* 改45: 会员资费选中态改橙色底 (类名用tabmem, 避免与.mem内容区样式冲突) */
.tab.tabmem.on{background:linear-gradient(135deg,#f59e0b,#d97706)}

.wrap{max-width:1060px;margin:0 auto;padding:16px}
/* 控制条 */
.controls{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;gap:18px 8px;flex-wrap:wrap;align-items:center;position:sticky;top:8px;z-index:20}
.search{flex:1 1 220px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;background:#fafbfc;color:var(--ink);outline:none}
.search input:focus{border-color:#6d85e0;background:#fff}
.search svg{position:absolute;left:10px;top:10px;opacity:.5}
.ctrl{display:flex;gap:6px;flex-wrap:nowrap}
select{border:1px solid var(--line);border-radius:10px;padding:8px 8px;background:#fafbfc;color:var(--ink);outline:none;max-width:150px;width:110px}
/* 改42: 图例改为多行排版, 每条说明独占一行 */
/* 改54: 图例改用块级元素强制每行一条, 不依赖flex */
.legend{font-size:11.5px;color:var(--sub);padding:8px 4px 2px;line-height:1.5}
.legend div{display:block}
.legend b{color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:1px}
.dot.g{background:var(--ok)} .dot.r{background:#dc2626} .dot.n{background:var(--no)}
.sl{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;color:#6b7280;margin-right:7px;white-space:nowrap}
/* 改36: 灯文字颜色随库存红绿 */
.sl.g{color:var(--ok)}
/* 改52: 无货库存文字加删除线, 线色跟随文字色 */
.sl.r{color:#dc2626;text-decoration:line-through;text-decoration-color:#dc2626;text-decoration-thickness:1.5px}
.sl .dot{margin-right:2px}

/* 字母导航 */
.alpha{margin-top:4px;display:none;gap:5px;overflow-x:auto;padding-bottom:4px}
/* 改38: 字母导航在吸顶容器内独占一行 */
#alpha{flex:1 1 100%}
.alpha.show{display:flex}
.alpha button{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);color:#4b5563;font-weight:600;font-size:13px}
.alpha button.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* 改43: 字母导航说明分两行, 标题行 + 示例行 */
.alphahint{margin-top:6px;font-size:11.5px;color:#8a93a3;padding:0 2px;display:flex;flex-direction:column;gap:2px;line-height:1.5}
.alphahint b{font-weight:800}
/* 改67: 游戏版本多选下拉(勾选可认证/非认证/限定版) */
.vsel{position:relative}
.vsel-btn{flex:1 1 0;min-width:0;max-width:none;border:1px solid var(--line);border-radius:10px;padding:8px 8px;background:#fafbfc;color:var(--ink);outline:none;font-size:14px;line-height:1.55;display:flex;align-items:center;justify-content:space-between;gap:4px}
.vsel-btn .vt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* 改67n: 角标改单个细线下三角(chevron), 取消上三角 */
.vsel-btn .arr{position:relative;width:9px;height:9px;flex:0 0 auto}
.vsel-btn .arr::before{content:"";position:absolute;left:1px;top:0;width:6.5px;height:6.5px;border-left:1.6px solid #8a93a3;border-top:1.6px solid #8a93a3;transform:rotate(-135deg)}
.vsel.open .vsel-btn{border-color:#6d85e0;background:#fff}
.vsel-pop{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(16,24,40,.14);padding:0;overflow:hidden;z-index:40}
.vsel.open .vsel-pop{display:block}
/* 改67e: 弹层选项排版对齐原生select菜单(14号字/同内边距/左对齐) */
/* 改67j: 选项之间加分隔线(与原生菜单一致) */
.vsel-item{padding:10px 14px;font-size:14px;line-height:1.4;cursor:pointer;white-space:nowrap;color:var(--ink);border-bottom:1px solid var(--line)}
.vsel-item:last-child{border-bottom:none}
.vsel-item:hover{background:#f1f4f9}
.vsel-item.on{color:var(--brand);font-weight:600;background:var(--psbg)}
/* 改67: 红色重置按钮 —— 一键恢复所有筛选条件为默认 */
.resetBtn{border-radius:10px;background:#dc2626;color:#fff;font-weight:700;padding:8px 14px;box-shadow:0 1px 3px rgba(220,38,38,.35);white-space:nowrap}
.resetBtn:active{transform:scale(.95)}
.alphahint .hl1{color:#111}
.alphahint .hl2{color:#7c3aed}
.alphahint .hl3{color:#e4002b}

/* 游戏卡 */
#psList,.glist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ghead-row{display:flex;align-items:center;gap:8px;margin:10px 2px 2px;scroll-margin-top:70px}
.ghead{font-size:13px;font-weight:800;color:var(--brand);letter-spacing:2px}
.ghead-row:first-child{margin-top:2px}
.gline{flex:1;height:1px;background:var(--line)}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow);display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
/* 改68: 游戏封面位 —— covers/manifest.json 有映射则显示真实封面, 无则显示首字占位 */
.gcover{flex:0 0 auto;width:96px;height:128px;border-radius:10px;overflow:hidden;background:#eef1f6;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.gcover img{width:100%;height:100%;object-fit:cover;display:block}
.gcover.ph .phc{font-size:30px;font-weight:800;color:#ccd3df;line-height:1}
.gcover.ph .pht{font-size:10px;color:#c3c9d4;margin-top:7px}
.gmain{flex:1 1 300px;min-width:0}
.gname{font-size:15.5px;font-weight:700;line-height:1.35;word-break:break-word}
.gname small{font-size:11px;font-weight:600;color:#6b7280;background:#f1f4f9;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.gen{color:var(--sub);font-size:12px;margin-top:2px;word-break:break-word}
.gmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2.5px 9px;font-size:11.5px;font-weight:600;background:#f1f4f9;color:#4b5563}
.chip .pre{font-style:normal;font-weight:500;color:#9aa3af;margin-right:1px}
.chip.ps{background:var(--psbg);color:var(--ps)}
.chip.host{background:var(--goldbg);border:1px solid #f3e2b2;color:var(--gold)}
.chip.ns{background:var(--nsbg);color:var(--ns)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.no{background:#fee2e2;color:#dc2626;text-decoration:line-through;text-decoration-color:#dc2626;text-decoration-thickness:1.5px}
.gprices{display:flex;gap:6px;flex-wrap:wrap}
.pt{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:6px 9px 5px;min-width:0;text-align:center}
/* 改33: 三价签等宽等高 */
.gprices{align-items:stretch}
/* 改67s: 价签固定宽度, 不再按库存文字内容自适应——PS4/PS5双库存与单库存卡片价签同宽, 消除"有大有小" */
.gprices .pt{flex:0 0 auto;width:150px}
/* 改29: 价签动态描边 */
.pt.bok{border:1.6px solid var(--ok)}
.pt.bno{border:1.6px solid #dc2626}
.pt.bpart{border:1.6px solid #f5a35c}
.pt .t{font-size:10.5px;color:var(--sub);white-space:nowrap}
.pt .v{font-size:16px;font-weight:800;margin-top:1px}
/* 改34: 库存灯行占据剩余空间并垂直居中, 使单灯与可认证双灯的中间对齐 */
.pt{display:flex;flex-direction:column}
.pt .s{font-size:10.5px;margin-top:2px;font-weight:600;min-height:14px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;align-content:center;column-gap:4px;row-gap:1px;flex:1 1 auto}
.pt .v.off{color:#c4c9d2}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:34px 14px;text-align:center;color:#98a0ab;margin-top:12px}
.morebtn{display:block;margin:14px auto 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 26px;font-weight:600;color:#4b5563}
.morebtn:hover{border-color:#6d85e0;color:var(--brand)}

/* NS 表 */
.nstable{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.nstable th{background:#f8f9fc;color:#374151;font-size:12px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.nstable td{padding:9px 10px;border-bottom:1px solid #f0f2f7;vertical-align:top}
.nstable tr:last-child td{border-bottom:none}
.ns-title{font-weight:700}
.ns-en{color:var(--sub);font-size:11.5px}

/* 资费页 */
.mem{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;overflow-x:auto}
.mcard h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.mcard h3 .tag{font-size:11px;border-radius:6px;padding:2px 8px;color:#fff}
.ptable{width:100%;border-collapse:separate;border-spacing:1px;font-size:12.5px;background:#c3cdf2}
/* 改67q: 缝隙透色法画网格线——单元格间1px缝隙透出表格底色, 背景色物理上不可能断裂;
   底色按会员卡主题色在JS里动态设置(周租蓝/不限时紫/终身土黄), 单元格不再用border */
.ptable th{background:#f6f8fc;color:#4b5563;font-size:11.5px;padding:7px 8px;text-align:center;vertical-align:middle;white-space:nowrap}
/* 改56: 单元格居中, 尽量不换行 */
.ptable td{padding:7px 8px;background:#fff;text-align:center;vertical-align:middle;white-space:nowrap}
/* 改59: 版本列(可认证/非认证)字重统一 */
.ptable td.cert{font-weight:600}
.ptable tr td:first-child{font-weight:700}
.plan-badge{display:inline-block;min-width:34px;text-align:center;border-radius:6px;font-weight:800;padding:1px 6px;color:#fff}
.rules li,.notes li{margin:4px 0 4px 18px}
/* 改65: 注意事项去符号、全部左对齐、正常换行 */
.notes li{list-style:none;margin:6px 0}
.notes .seg{display:block}
.rules,.notes{font-size:12.5px;color:#374151}
/* 改67f: 资费卡底部行(租赁数量chip + 标准价小字说明) */
.mfoot{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.mnote{font-size:11px;color:#98a0ab;line-height:1.5;flex:1 1 200px;min-width:0}
.notice-box{background:#fff8ec;border:1px solid #f5dfae}

footer{margin-top:22px;padding:18px 16px 30px;text-align:center;color:#98a0ab;font-size:11.5px;background:#fff;border-top:1px solid var(--line)}
footer b{color:#4b5563}

/* 改67l: 小屏断点430→500px, 覆盖大屏手机(如Pro Max/安卓480dp)保证4筛选+重置同一行 */
@media (max-width:500px){
  .wrap{padding-left:10px;padding-right:10px}
  .controls{gap:14px 4px;padding:8px}
  .ctrl{gap:4px;flex:1 1 100%}
  .ctrl select,.ctrl .vsel-btn{flex:1 1 0;width:auto;max-width:none;min-width:0;font-size:11.5px;padding:8px 3px}
  .ctrl .vsel-btn{justify-content:space-between}
  .ctrl .resetBtn{flex:0 0 auto;padding:8px 7px;font-size:12.5px}
}
@media (max-width:640px){
 .gcard{gap:8px}
 /* 改68: 手机端封面位缩小 */
 .gcover{width:74px;height:99px;border-radius:8px}
 .gcover.ph .phc{font-size:24px}
 .gmain{flex:1 1 150px}
 .gprices{flex:1 1 100%}
 /* 改67s: 小屏恢复满行均分(覆盖桌面固定150px宽) */
 .gprices .pt{flex:1 1 0;width:auto;min-width:0;padding:6px 4px 5px}
 .pt .v{font-size:15px}
 .hero{padding-bottom:60px}
 .brand h1{font-size:17px}
 .ptable th,.ptable td{padding:6px}
/* 改57: 小屏压缩资费表字号与内边距, 尽量单屏放下不换行 */
@media (max-width:430px){
  .ptable{font-size:11px}
  .ptable th{font-size:10.5px;padding:6px 4px}
  .ptable td{padding:6px 4px}
}
 .nstable{display:block;overflow-x:auto;white-space:nowrap}
}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <div class="logo"><img src="avatar.jpg" alt="夏天Jackey"></div>
      <div>
        <h1>「夏天Jackey」PS丨NS 数字版游戏</h1>
        <div class="sub">千款游戏 · 会员特价 · 一人一号</div>
      </div>
    </div>
    <div class="promo">🎉<div class="plines" id="promoTxt"></div></div>
  </div>
</header>

<div class="tabs">
  <div class="tabbar">
    <button class="tab ps on" id="tabPS" data-tab="ps"><span>🎮 PS 游戏</span><span class="cnt" id="cntPS">0</span></button>
    <button class="tab ns" id="tabNS" data-tab="ns"><span>🎮 NS 游戏</span></button>
    <button class="tab tabmem" id="tabMEM" data-tab="mem"><span>🏷️ 会员资费</span></button>
  </div>
</div>

<main class="wrap">
  <!-- 控制栏（仅列表页） -->
  <div class="controls" id="controls">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#6b7280" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="搜索游戏中文名 / 英文名…" autocomplete="off">
    </div>
    <div class="ctrl">
      <!-- 改67k: 4个筛选项全部重写为同一套自绘下拉(原生select弹层由系统渲染无法控样式, 4项统一后手机/电脑完全一致) -->
      <div class="vsel" id="hostFilter"></div>
      <div class="vsel" id="regionFilter"></div>
      <div class="vsel" id="verFilter"></div>
      <div class="vsel" id="sortSel"></div>
      <!-- 改67: 红色重置按钮 -->
      <button class="resetBtn" id="resetBtn" title="恢复所有筛选条件为默认">重置</button>
    </div>
    <!-- 改38: 字母导航入吸顶容器, 下滑时保持可见 -->
    <div class="alpha" id="alpha"></div>
  </div>
  <div class="legend" id="legendPS">
    <div><span class="dot g"></span>有货 / <span class="dot r"></span>无货</div>
    <div><b>可认证</b>：买家账号游玩（有存档有奖杯）</div>
    <div><b>非认证</b>：卖家账号游玩（无存档无奖杯）</div>
    <div><b>限定版</b>：离线认证30天（有存档有奖杯）</div>
  </div>

  <!-- PS -->
  <section id="psView">

<script>
(function(){
const D=window.GT_DATA||{};
const PS=D.ps||[], NS=D.ns||[], MEM=D.membership||{};
const CONFIG={ shopUrl:"", q:"" };   // 如需“立即购买”跳转，请填店铺下单链接
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};

/* 改72: IndexedDB 图片本地库 —— 不依赖 ServiceWorker, 微信iPhone(WKWebView)也能秒出; 全平台统一渲染路径 */
function gtIdb(){return new Promise(function(res){try{var r=indexedDB.open("gtImg",1);r.onupgradeneeded=function(){try{if(!r.result.objectStoreNames.contains("img"))r.result.createObjectStore("img");}catch(e){}};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)};}catch(e){res(null)}})}
function gtIdbGet(k){return gtIdb().then(function(db){if(!db)return null;return new Promise(function(res){try{var t=db.transaction("img").objectStore("img").get(k);t.onsuccess=function(){res(t.result||null)};t.onerror=function(){res(null)}}catch(e){res(null)}})})}
function gtIdbPut(k,blob){return gtIdb().then(function(db){if(!db)return;return new Promise(function(res){try{var t=db.transaction("img","readwrite");t.objectStore("img").put(blob,k);t.oncomplete=function(){res()};t.onerror=function(){res()}}catch(e){res()}})})}
function gtIdbCount(){return gtIdb().then(function(db){if(!db)return 0;return new Promise(function(res){try{var t=db.transaction("img").objectStore("img").count();t.onsuccess=function(){res(t.result||0)};t.onerror=function(){res(0)}}catch(e){res(0)}})})}
function gtIdbClean(valid){return gtIdb().then(function(db){if(!db)return;return new Promise(function(res){try{var t=db.transaction("img","readwrite");var kr=t.objectStore("img").openCursor();kr.onsuccess=function(ev){var c=ev.target.result;if(c){if(!valid.has(c.key))c.delete(c.key);c.continue();}else res()};kr.onerror=function(){res()}}catch(e){res()}})})}
/* 封面渲染: 本地有 → blobURL 秒出; 没有 → 网络取一次并顺带入库 */
function gtCoverSrc(im,url){
  gtIdbGet(url).then(function(b){
    if(b){try{im.src=URL.createObjectURL(b);}catch(e){im.src=url;}return;}
    fetch(url).then(function(r){return r&&r.ok?r.blob():null}).then(function(bl){
      if(bl){gtIdbPut(url,bl);try{im.src=URL.createObjectURL(bl);}catch(e){im.src=url;}}
      else{im.src=url;}
    }).catch(function(){im.src=url;});
  }).catch(function(){im.src=url;});
}
/* 后台全量预存(4并发, 已存跳过, 中断下次打开续传); 头像/背景每次小刷新保新鲜 */
async function gtPrecacheAll(urls){
  const list=[],seen={};(urls||[]).forEach(u=>{if(u&&!seen[u]){seen[u]=1;list.push(u);}});
  let i=0;
  const workers=Array.from({length:4},async function(){
    while(i<list.length){
      const u=list[i++];
      try{
        if(u!=="avatar.jpg"&&u!=="bg.jpg"){const b=await gtIdbGet(u);if(b)continue;}
        const r=await fetch(u);
        if(r&&r.ok){const bl=await r.blob();if(bl&&bl.size)await gtIdbPut(u,bl);}
      }catch(e){}
    }
  });
  await Promise.all(workers);
}

/* 文案挂载 */
/* 改51: 可认证/非认证合并为表头, 两个活动各自成行 —— 表达两类租赁都享受拍2送3/拍3送9 */
$("#promoTxt").innerHTML=D.promo?"<b>可认证 / 非认证</b>"+D.promo.split("，").map(s=>"<i>"+s+"</i>").join(""):"";
$("#cntPS").textContent=PS.length;

/* 版本标签 */
const REGMAP={港:"港版",日:"日版",美:"美版",欧:"欧版",国:"国行",韩:"韩版",台:"台版",中:"国行"};
function regionName(r){r=(r||"").trim();if(!r)return"";const c=r.slice(0,1);return REGMAP[c]||r;}

function stockState(v){v=(v||"").trim();return (v==="有"||v==="1")?1:0;}
function fmtMoney(v){v=String(v==null?"":v).trim();if(v===""||v==="-"||v==="无")return null;const n=parseFloat(v);return isNaN(n)?null:n;}
const HOST_PLAT={PS4:"ps",PS5:"ps",PSVR:"ps",NS1:"ns",NS2:"ns"};

/* ---------- 渲染 ---------- */
let hostSel="",regionSel="",verSel=[],sortMode="src",kw="";

/* 改67: 租赁版本 -> 对应7天/30天价格字段; 勾选后按价格排序与过滤均取该版本价格 */
const VER_META={ck:"ck7",fc:"fc7",xd:"xd30"};
/* 改67k: 各租赁版本的库存判定字段(1=有货): 可认证=PS4或PS5任一有货即可 */
const VER_STOCK={ck:["ck4","ck5"],fc:["fc"],xd:["xd"]};
const VER_NAME={ck:"可认证",fc:"非认证",xd:"限定版"};
function verPriceOf(g){
  const keys=verSel.length?verSel:["ck","fc","xd"];
  const vals=keys.map(k=>fmtMoney(g[VER_META[k]])).filter(x=>x!=null);
  if(!vals.length)return null;
  return sortMode==="priceDesc"?Math.max.apply(null,vals):Math.min.apply(null,vals);
}

function platformOf(h){return (HOST_PLAT[h]||"");}

/* 改69: 模糊搜索 —— ①两侧去分隔符(·・:：（）空格等)后包含即命中 ②仍不中则按"字序匹配"(所有字按顺序出现即可, 无需连续): 真三国 → 真·三国无双起源 ✅ */
function normStr(s){return String(s||"").toLowerCase().replace(/[\s\u00b7\u2022\u2027\u30fb.:：,，、\-—_~～!！?？()（）\u3010\u3011"'“”‘’]/g,"");}
function subseq(needle,hay){let i=0;for(let j=0;j<hay.length&&i<needle.length;j++){if(hay[j]===needle[i])i++;}return i===needle.length;}

function filterPS(){
  const q=kw.trim().toLowerCase();
  let arr=PS.slice();
  if(sortMode==="date"){arr.sort((a,b)=>parseDate(b.date)-parseDate(a.date)||(a.name<b.name?-1:1));}
  /* 改67: 新增发售日期 旧→新 */
  else if(sortMode==="dateAsc"){arr.sort((a,b)=>parseDate(a.date)-parseDate(b.date)||(a.name<b.name?-1:1));}
  /* 改67: 价格排序 —— 仅在勾选了游戏版本中的租赁版本后生效; 未勾选时保持默认顺序。
     多选时: 高→低取所勾选版本中最高价, 低→高取最低价; 无价格的排最后 */
  else if((sortMode==="priceDesc"||sortMode==="priceAsc")&&verSel.length){
    arr.sort((a,b)=>{
      const pa=verPriceOf(a),pb=verPriceOf(b);
      if(pa===null&&pb===null)return a.name<b.name?-1:1;
      if(pa===null)return 1;
      if(pb===null)return -1;
      if(pa!==pb)return sortMode==="priceDesc"?pb-pa:pa-pb;
      return a.name<b.name?-1:1;
    });
  }
  if(q||hostSel||regionSel||verSel.length){
    arr=arr.filter(g=>{
      if(hostSel&&!(g.hs||[]).includes(hostSel))return false;
      if(regionSel&&g.region!==regionSel)return false;
      /* 改67k: 勾选租赁版本后, 仅显示该版本当前有货的游戏(可认证=PS4或PS5任一有货; 非认证=fc有货; 限定版=xd有货) */
      if(verSel.length&&!verSel.some(k=>VER_STOCK[k].some(f=>String(g[f]||"").trim()==="1")))return false;
      if(q){const nq=normStr(q);if(nq){const hay=normStr(g.name+" "+g.en+" "+g.region);if(hay.indexOf(nq)<0&&!subseq(nq,hay))return false;}}
      return true;
    });
  }
  return arr;
}

function parseDate(s){const m=String(s||"").match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);return m? (+m[1])*10000+(+m[2])*100+(+m[3]):0;}

let curRows=[],rendered=0,PAGE=120;
function renderPS(){
  curRows=filterPS();
  rendered=0; $("#psList").innerHTML="";
  Object.keys(__letterSeen).forEach(k=>delete __letterSeen[k]);
  $("#alpha").classList.remove("show"); $("#alpha").innerHTML="";
  if(curRows.length){
    $("#alpha").classList.add("show");
    const letters=[];curRows.forEach(o=>{const L=o.letter||"";if(L&&letters.indexOf(L)<0)letters.push(L);});
    letters.sort().forEach(L=>{const b=el("button",null,L);b.onclick=()=>jumpToLetter(L);$("#alpha").append(b);});
  }
  $("#psEmpty").style.display=curRows.length?"none":"block";
  renderMore(PAGE);
}
function renderMore(extra){
  const list=$("#psList");let added=0;
  while(rendered<curRows.length&&added<extra){
    const o=curRows[rendered];rendered++;added++;
    if(renderedAddedForLetter(o)){list.appendChild(letterHead(o.letter));}
    list.appendChild(gameCard(o));
  }
  $("#moreBtn").style.display=rendered<curRows.length?"block":"none";
}
const __letterSeen={};
/* 改14: 点击字母直达 —— 先把目标字母区渲染出来再滚动，无需先点"加载更多" */
function jumpToLetter(L){
  const idx=curRows.findIndex(o=>(o.letter||"")===L);
  if(idx<0)return;
  if(rendered<=idx){renderMore(idx+1-rendered);}
  const hd=$("#sec-"+L);
  if(hd){hd.scrollIntoView({behavior:"smooth",block:"start"});}
  else{requestAnimationFrame(()=>{const h2=$("#sec-"+L);if(h2)h2.scrollIntoView({behavior:"smooth",block:"start"});});}
}
function renderedAddedForLetter(o){
  const L=o.letter||"";
  if(!L)return false;
  if(__letterSeen[L])return false;
  __letterSeen[L]=true;return true;
}
function letterHead(L){
  const w=el("div","ghead-row");w.id="sec-"+L;
  w.appendChild(el("div","ghead",L));
  w.appendChild(el("div","gline"));
  return w;
}
function fmtMoney(v){v=String(v==null?"":v).trim();if(v===""||v==="-"||v==="无")return null;const n=parseFloat(v);return isNaN(n)?null:n;}
function priceTile(label,val,lights,sts){
  /* 改29 动态描边: 全无货=红 / 全有货=绿 / 部分有货=浅橙 (与库存灯同色系) */
  const arr=(sts||[]).filter(x=>x!==null&&x!==undefined);
  let bcls="";
  if(arr.length){
    const inn=arr.filter(Boolean).length;
    if(inn===0)bcls=" bno";
    else if(inn===arr.length)bcls=" bok";
    else bcls=" bpart";
  }
  const p=el("div","pt"+bcls);
  p.appendChild(el("div","t",label));
  const v=el("div","v"+(val==null?" off":""));
  v.textContent=val==null?"—":"¥"+val; p.appendChild(v);
  const s=el("div","s");
  (lights||[]).forEach(x=>s.appendChild(x));
  p.appendChild(s);
  return p;
}
/* 库存灯: st=1 有(绿) / 0 无(红) / null 不显示 */
function stockLight(txt,st){
  if(st===null||st===undefined)return null;
  const s=el("span","sl "+(st?"g":"r"));
  s.appendChild(el("i","dot "+(st?"g":"r")));
  s.appendChild(document.createTextNode(txt));
  return s;
}
/* 改68: 封面映射 —— 运行时读一次 covers/manifest.json, 卡片按游戏名查封面路径; 加载失败不影响列表 */
const COVERS={};
try{
  fetch("covers/manifest.json?t="+Date.now()).then(r=>r.ok?r.json():{}).then(m=>{
    if(m&&typeof m==="object"){
      Object.keys(m).forEach(k=>{COVERS[k]=m[k];});
      /* 封面到货后若列表已渲染, 刷新当前列表让占位变封面 */
      if(rendered>0&&typeof renderPS==="function"){renderPS();}
      /* 改72: 后台全量预存进 IndexedDB(全平台含微信iPhone); 完成后清理已不再引用的旧图 */
      setTimeout(function(){
        const valid=new Set(["avatar.jpg","bg.jpg"]);
        Object.keys(m).forEach(k=>{if(typeof m[k]==="string")valid.add(m[k]);});
        const arr=Array.from(valid);
        gtPrecacheAll(arr).then(function(){return gtIdbClean(valid);}).catch(function(){});
      },2000);
    }
  }).catch(function(){});
}catch(e){}

function gameCard(g){
  const card=el("div","gcard");
  /* 改68: 卡片封面(有映射显示真图, 无映射显示首字占位) */
  (function(){
    const f=COVERS[g.name];
    const box=el("div","gcover"+(f?"":" ph"));
    if(f){const im=document.createElement("img");im.alt="";im.loading="lazy";gtCoverSrc(im,f);box.appendChild(im);}
    else{box.appendChild(el("div","phc",String(g.name||"").slice(0,1)));box.appendChild(el("div","pht","封面待接入"));}
    card.appendChild(box);
  })();
  const main=el("div","gmain");
  const nm=el("div","gname",g.name);
  main.appendChild(nm);
  if(g.en)main.appendChild(el("div","gen",g.en));
  /* 信息行(改16B/67t): 发售日期/游戏版本(原发售地区)/支持主机 —— 纯固定信息, 不随库存变动 */
  const meta=el("div","gmeta");
  if(g.date){const c=el("span","chip");c.appendChild(el("i","pre","发售日期"));c.appendChild(document.createTextNode(g.date));meta.appendChild(c);}
  if(g.region){const c=el("span","chip");c.appendChild(el("i","pre","游戏版本"));c.appendChild(document.createTextNode(g.region));meta.appendChild(c);}
  if((g.hs||[]).length){
    const hc=el("span","chip host");
    hc.appendChild(el("i","pre","支持主机"));
    hc.appendChild(document.createTextNode(" "+g.hs.join(" ")));
    meta.appendChild(hc);
  }
  main.appendChild(meta);
  card.appendChild(main);
  /* 价签(改17): 可认证=PS4/PS5 独立库存位; 非认证=共用位; 限定版=独立位 */
  const prices=el("div","gprices");
  /* 改39: 仅支持PS5时, 可认证库存文字显示"库存：有/无"(不带PS5前缀) */
  /* 改67v: PSVR等无PS4/PS5子行的游戏, 可认证库存显示单个"库存：有/无"(取通用位ck4) */
  const hasPS45=(g.hs||[]).some(h=>h==="PS4"||h==="PS5");
  const onlyPS5=hasPS45&&(g.hs||[]).length===1&&g.hs[0]==="PS5";
  let ckLights;
  if(hasPS45){
    const ck4Label=(onlyPS5?"":"PS4")+"库存：",ck5Label=(onlyPS5?"":"PS5")+"库存：";
    ckLights=[stockLight(ck4Label+(g.ck4?"有":"无"),g.ck4),stockLight(ck5Label+(g.ck5?"有":"无"),g.ck5)].filter(Boolean);
  }else{
    ckLights=[stockLight("库存："+(g.ck4?"有":"无"),g.ck4)].filter(Boolean);
  }
  prices.appendChild(priceTile("可认证 · 7天",fmtMoney(g.ck7),ckLights,[g.ck4,g.ck5]));
  prices.appendChild(priceTile("非认证 · 7天",fmtMoney(g.fc7),[stockLight("库存："+(g.fc?"有":"无"),g.fc)],[g.fc]));
  prices.appendChild(priceTile("限定版 · 30天",fmtMoney(g.xd30),[stockLight("库存："+(g.xd?"有":"无"),g.xd)],[g.xd]));
  card.appendChild(prices);
  return card;
}

/* ---------- NS ---------- */
function renderNS(){
  const tb=$("#nsTable");
  const head=el("tr",null);["游戏名称","主机","版本","发售日期","主号库存","副号库存","限定版库存"].forEach(t=>head.appendChild(el("th",null,t)));
  const th=el("thead",null);th.appendChild(head);tb.appendChild(th);
  const tbd=el("tbody",null);
  NS.forEach(g=>{
    g.hosts.forEach(h=>{
      const tr=el("tr",null);
      let td=el("td",null);
      const nm=el("div","ns-title",g.name);
      if(h.h===g.hosts[0].h&&g.en){const en=el("div","ns-en",g.en);nm.appendChild(en);}
      td.appendChild(nm);tr.appendChild(td);
      tr.appendChild(el("td",null,h.h));
      tr.appendChild(el("td",null,regionName(g.region)));
      tr.appendChild(el("td",null,h.date||g.date||""));
      const mk=(v)=>{const s=stockState(v);const e=el("span","chip "+(s?"ok":"no"),s?"有":"无");return e;};
      const c1=el("td",null);c1.appendChild(mk(h.ck_stock));tr.appendChild(c1);
      const c2=el("td",null);c2.appendChild(mk(h.fc_stock));tr.appendChild(c2);
      const c3=el("td",null);c3.appendChild(mk(h.xd_stock));tr.appendChild(c3);
      tbd.appendChild(tr);
    });
  });
  tb.appendChild(tbd);
}

/* 改55: NS页暂不对外展示游戏清单, 仅显示上架预告 (renderNS保留, 随时可恢复) */

/* ---------- 会员资费 ---------- */
const CLSCOLORS={周租会员:"#1d6fe0",不限时会员:"#7c3aed",终身会员:"#b7791f"};
function renderMEM(){
  const v=$("#memView");v.innerHTML="";
  const intro=el("div","mcard");
  intro.appendChild(el("h3",null,MEM.title||"会员资费"));
  /* 改47: 会员资费说明与PS图例同款式, 按分号分行竖排 */
  const sub=el("div","gen");(MEM.sub||"").split("；").forEach(s=>{sub.appendChild(el("div",null,s));});
  intro.appendChild(sub);
  v.appendChild(intro);

  const groups={};
  (MEM.plans||[]).forEach(p=>{(groups[p.class]=groups[p.class]||[]).push(p);});
  Object.keys(groups).forEach(cls=>{
    const card=el("div","mcard");
    const h3=el("h3",null);
    h3.appendChild(el("span","tag",cls)).style.background=CLSCOLORS[cls]||"#666";
    h3.appendChild(document.createTextNode("（"+cls+"）"));
    h3.lastChild.remove();
    card.appendChild(h3);
    const tbl=el("table","ptable");
    /* 改67q: 网格线颜色=会员卡主题色(徽章色32%透明度): 周租蓝/不限时紫/终身土黄 */
    const _c=(CLSCOLORS[cls]||"#666666").replace("#","");
    tbl.style.background="rgba("+parseInt(_c.substr(0,2),16)+","+parseInt(_c.substr(2,2),16)+","+parseInt(_c.substr(4,2),16)+",.32)";
    const thead=el("tr",null);
    /* 改56: 表头文案调整 */
    /* 改67f: 终身会员卡的会费表头改为（终身）, 其余仍为（年） */
    const feeHead=cls==="终身会员"?"会费（终身）":"会费（年）";
    ["方案","版本",feeHead,"可玩游戏","会员价","租期","押金"].forEach(t=>thead.appendChild(el("th",null,t)));
    tbl.appendChild(thead);
    /* 改56: 相邻同方案合并单元格居中, 分组加框; 租期去掉"（到期可续）" */
    const rows=groups[cls];let i=0;
    while(i<rows.length){
      let j=i;while(j<rows.length&&rows[j].scheme===rows[i].scheme)j++;
      for(let k=i;k<j;k++){
        const tr=el("tr",(k===i?"g-first ":"")+(k===j-1?"g-last ":"")+"g-row");
        if(k===i){
          const td0=el("td",null);td0.rowSpan=j-i;
          const b=el("span","plan-badge",rows[i].scheme);b.style.background=CLSCOLORS[cls]||"#666";
          td0.appendChild(b);tr.appendChild(td0);
        }
        tr.appendChild(el("td","cert",rows[k].cert));
        /* 改67f: 会费去掉"/终身"后缀(与"/年"同规则) */
        tr.appendChild(el("td",null,(rows[k].fee||"").replace(/\/(年|终身)/g,"")));
        tr.appendChild(el("td",null,rows[k].eligible));
        tr.appendChild(el("td",null,rows[k].price));
        tr.appendChild(el("td",null,(rows[k].tenure||"").replace(/（到期可续）/g,"")));
        tr.appendChild(el("td",null,(MEM.common||{}).deposit||"免押"));
        tbl.appendChild(tr);
      }
      i=j;
    }
    card.appendChild(tbl);
    const wrap=el("div");wrap.style.overflowX="auto";wrap.appendChild(tbl);card.appendChild(wrap);
    /* 改59: 租赁数量改为金色chip(同PS卡片"支持主机"样式) */
    const rc=el("span","chip host");rc.appendChild(el("i","pre","租赁数量"));rc.appendChild(document.createTextNode(" "+((MEM.common||{}).count||"1个/次")));
    /* 改67g: 底部一行 = 租赁数量chip + 说明小字(按会员类别配色, 同方案徽章色) */
    const CLASS_NOTE={
      "周租会员":{t:"不在可玩范围内的游戏，按非会员标准价租赁",c:"#1d6fe0"},
      "不限时会员":{t:"发售＜1个月内的游戏，按标准价7折租赁",c:"#7c3aed"},
      "终身会员":{t:"标准价：指商家在平台上架的商品价，即非会员价格",c:"#b7791f"}
    };
    const mfoot=el("div","mfoot");mfoot.appendChild(rc);
    const cn=CLASS_NOTE[cls];
    if(cn){
      /* 改67i: 租赁数量chip底纹/描边/文字 跟随右侧说明文字颜色(浅色底+同色系描边) */
      rc.style.background=cn.c+"16";
      rc.style.borderColor=cn.c+"59";
      rc.style.color=cn.c;
      const nt=el("div","mnote",cn.t);nt.style.color=cn.c;mfoot.appendChild(nt);
    }
    card.appendChild(mfoot);
    v.appendChild(card);
  });
  const nc=el("div","mcard notice-box");
  nc.appendChild(el("h3",null,"⚠️ 说明与注意事项"));
  const ul2=el("ul","notes");(MEM.notice||[]).forEach(t=>{const li=el("li",null);t.split("\n").forEach((seg,i)=>{const sp=document.createElement("span");sp.className="seg";sp.textContent=seg;li.appendChild(sp);});ul2.appendChild(li);});nc.appendChild(ul2);
  v.appendChild(nc);
}

/* ---------- Tab 与事件 ---------- */
function showTab(name){
  $("#psView").style.display=name==="ps"?"block":"none";
  $("#nsView").style.display=name==="ns"?"block":"none";
  $("#memView").style.display=name==="mem"?"block":"none";
  $("#controls").style.display=name==="ps"?"block":"none";
  $("#legendPS").style.display=name==="ps"?"block":"none";
  document.querySelectorAll(".tab").forEach(b=>{
    b.classList.toggle("on",b.dataset.tab===name);
  });
  if(name==="ps"){renderPS();}
  if(name==="ns"){renderNSComing();}
  if(name==="mem")renderMEM();
  window.scrollTo({top:0});
}

/* 输入防抖 */
let tmr=null;
$("#q").addEventListener("input",e=>{kw=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{resetLetter();renderPS();},200);});
/* 改67k: 统一下拉组件工厂 —— 4个筛选项共用同一结构/CSS/交互, 保证观感一模一样 */
function makeVsel(box,def,title,opts,onPick,fmt){
  box.innerHTML='<button type="button" class="vsel-btn"><span class="vt"></span><span class="arr"></span></button>'
    +'<div class="vsel-pop">'+opts.map(o=>'<div class="vsel-item'+(o.v===def?" on":"")+'" data-v="'+o.v+'">'+o.label+"</div>").join("")+"</div>";
  let val=def;
  const vt=()=>box.querySelector(".vt");
  function sync(){
    const mobile=window.matchMedia("(max-width:500px)").matches;
    const cur=box.querySelector('.vsel-item[data-v="'+val+'"]');
    vt().textContent=(val===def)?title:(fmt?fmt(val,mobile):(cur?cur.textContent:title));
    vt().style.color=(val===def)?"":"var(--brand)";
    box.querySelectorAll(".vsel-item").forEach(it=>it.classList.toggle("on",it.dataset.v===val));
  }
  box.querySelector(".vsel-btn").addEventListener("click",e=>{
    e.stopPropagation();
    document.querySelectorAll(".vsel.open").forEach(v=>{if(v!==box)v.classList.remove("open");});
    box.classList.toggle("open");
  });
  box.querySelector(".vsel-pop").addEventListener("click",e=>{
    const it=e.target.closest(".vsel-item");if(!it)return;
    val=(val===it.dataset.v)?def:it.dataset.v;
    sync();onPick(val);
    box.classList.remove("open");
  });
  sync();
  return {get:()=>val,reset:()=>{val=def;sync();box.classList.remove("open");}};
}
document.addEventListener("click",e=>{if(!e.target.closest(".vsel"))document.querySelectorAll(".vsel.open").forEach(v=>v.classList.remove("open"));});
const vselHost=makeVsel($("#hostFilter"),"","主机型号",
  [{v:"",label:"主机型号"},{v:"PS5",label:"PS5"},{v:"PS4",label:"PS4"},{v:"PSVR",label:"PSVR"}],
  v=>{hostSel=v;resetLetter();renderPS();});
/* 改67/67t: 发售地区筛选(按钮名改【游戏版本】) */
const vselRegion=makeVsel($("#regionFilter"),"","游戏版本",
  [{v:"",label:"游戏版本"},{v:"港版",label:"港版"},{v:"日版",label:"日版"},{v:"美版",label:"美版"},{v:"欧版",label:"欧版"},{v:"国行",label:"国行"}],
  v=>{regionSel=v;resetLetter();renderPS();});
/* 改67/67t: 租赁版本单选(原【游戏版本】改名) —— 可认证/非认证/限定版; 小屏选中只显示版本名 */
const vselVer=makeVsel($("#verFilter"),"","租赁版本",
  [{v:"",label:"租赁版本"},{v:"ck",label:"可认证"},{v:"fc",label:"非认证"},{v:"xd",label:"限定版"}],
  v=>{verSel=v?[v]:[];resetLetter();renderPS();},
  (v,mobile)=>mobile?VER_NAME[v]:"租赁版本·"+VER_NAME[v]);
/* 改67: 排序 —— 删除名称排序, 新增 发售日期(旧→新) 与 价格(高→低/低→高) */
const vselSort=makeVsel($("#sortSel"),"src","排序",
  [{v:"src",label:"排序"},{v:"date",label:"发售日期（新→旧）"},{v:"dateAsc",label:"发售日期（旧→新）"},{v:"priceDesc",label:"价格（高→低）"},{v:"priceAsc",label:"价格（低→高）"}],
  v=>{sortMode=v;resetLetter();renderPS();});
/* 改67: 红色重置按钮 —— 所有筛选条件恢复默认 */
$("#resetBtn").addEventListener("click",()=>{
  kw="";$("#q").value="";
  vselHost.reset();vselRegion.reset();vselVer.reset();vselSort.reset();
  hostSel="";regionSel="";verSel=[];sortMode="src";
  resetLetter();renderPS();
});
$("#moreBtn").addEventListener("click",()=>renderMore(PAGE));
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
function resetLetter(){Object.keys(__letterSeen).forEach(k=>delete __letterSeen[k]);}
/* 改49: 返回顶部按钮 —— 下滑超过400px出现, 点击恢复刚打开链接时的初始状态(顶部+默认筛选) */
window.addEventListener("scroll",()=>{const b=$("#toTop");if(b)b.classList.toggle("show",window.scrollY>400);},{passive:true});
$("#toTop").addEventListener("click",()=>{
  kw="";$("#q").value="";
  vselHost.reset();vselRegion.reset();vselVer.reset();vselSort.reset();
  hostSel="";regionSel="";verSel=[];sortMode="src";
  resetLetter();renderPS();showTab("ps");
  window.scrollTo(0,0);
});

/* 读取 URL 参数 ?tab= & ?q= */
const params=new URLSearchParams(location.search);
const pq=params.get("q");
if(pq!==null&&pq!==""){$("#q").value=pq;kw=pq;}
const pt=params.get("tab");
if(pt==="ns"||pt==="mem"){showTab(pt);}else{showTab("ps");}

/* 改71b/72: 尽早注册 SW(updateViaCache=none); 每次打开让 SW 续传预存; 页脚指示器读 IDB 锁存数(在闭包内才能访问 gtIdbCount) */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(function(){});
  navigator.serviceWorker.ready.then(function(reg){
    if(reg.active)reg.active.postMessage({type:"precache"});
    else navigator.serviceWorker.controller&&navigator.serviceWorker.controller.postMessage({type:"precache"});
  }).catch(function(){});
}
function gtSwStat(){
  gtIdbCount().then(function(n){
    var el=document.getElementById("swStat");
    if(el&&n>0)el.textContent="⚡ 图片已锁存 "+n+" 张 · 再次打开秒出";
  }).catch(function(){});
}
var gtT=0;var gtTimer=setInterval(function(){gtT++;gtSwStat();if(gtT>48)clearInterval(gtTimer);},5000);
setTimeout(gtSwStat,3000);
})();
